name: CEP tokenizer characterization

on:
  push:
    paths:
      - "pyproject.toml"
      - "scripts/measure_context_tool_tokens.py"
      - "src/agent_control_plane/context_tool_exposure.py"
      - ".github/workflows/context-efficiency-tokenizer.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "scripts/measure_context_tool_tokens.py"
      - "src/agent_control_plane/context_tool_exposure.py"
      - ".github/workflows/context-efficiency-tokenizer.yml"

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[context-measure]"
      - name: Measure pinned tokenizer exposure
        run: python scripts/measure_context_tool_tokens.py
