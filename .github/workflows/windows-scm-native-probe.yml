name: windows-scm-native-probe

on:
  push:
    paths:
      - "src/agent_control_plane/windows_scm_adapter.py"
      - "src/agent_control_plane/windows_scm_service_host.py"
      - "src/agent_control_plane/windows_scm_native.py"
      - "src/agent_control_plane/windows_scm_native_runtime.py"
      - "src/agent_control_plane/windows_scm_binary_verification.py"
      - "src/agent_control_plane/windows_scm_registration.py"
      - "src/agent_control_plane/windows_scm_registration_plan.py"
      - "src/agent_control_plane/windows_scm_install_authorization.py"
      - "src/agent_control_plane/windows_scm_install_transaction.py"
      - "src/agent_control_plane/windows_scm_native_install_backend.py"
      - "tests/test_windows_scm_native.py"
      - "tests/test_windows_scm_native_runtime.py"
      - "tests/test_windows_scm_binary_verification.py"
      - "tests/test_windows_scm_registration.py"
      - "tests/test_windows_scm_registration_plan.py"
      - "tests/test_windows_scm_install_authorization.py"
      - "tests/test_windows_scm_install_transaction.py"
      - "tests/test_windows_scm_native_install_backend.py"
      - ".github/workflows/windows-scm-native-probe.yml"
  pull_request:
    paths:
      - "src/agent_control_plane/windows_scm_adapter.py"
      - "src/agent_control_plane/windows_scm_service_host.py"
      - "src/agent_control_plane/windows_scm_native.py"
      - "src/agent_control_plane/windows_scm_native_runtime.py"
      - "src/agent_control_plane/windows_scm_binary_verification.py"
      - "src/agent_control_plane/windows_scm_registration.py"
      - "src/agent_control_plane/windows_scm_registration_plan.py"
      - "src/agent_control_plane/windows_scm_install_authorization.py"
      - "src/agent_control_plane/windows_scm_install_transaction.py"
      - "src/agent_control_plane/windows_scm_native_install_backend.py"
      - "tests/test_windows_scm_native.py"
      - "tests/test_windows_scm_native_runtime.py"
      - "tests/test_windows_scm_binary_verification.py"
      - "tests/test_windows_scm_registration.py"
      - "tests/test_windows_scm_registration_plan.py"
      - "tests/test_windows_scm_install_authorization.py"
      - "tests/test_windows_scm_install_transaction.py"
      - "tests/test_windows_scm_native_install_backend.py"
      - ".github/workflows/windows-scm-native-probe.yml"

permissions:
  contents: read

jobs:
  native-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_windows_scm_native.py tests/test_windows_scm_native_runtime.py tests/test_windows_scm_registration.py tests/test_windows_scm_binary_verification.py tests/test_windows_scm_registration_plan.py tests/test_windows_scm_install_authorization.py tests/test_windows_scm_install_transaction.py tests/test_windows_scm_native_install_backend.py -q
      - name: Verify required registration SCM exports
        shell: pwsh
        run: |
          python -c "from agent_control_plane.windows_scm_registration_plan import probe_windows_scm_registration_api; p=probe_windows_scm_registration_api(); print(p); assert p.available"
      - name: Verify required native SCM exports
        shell: pwsh
        run: |
          python -c "from agent_control_plane.windows_scm_native import probe_windows_scm_native_api; p=probe_windows_scm_native_api(); print(p); assert p.available"

      - name: Verify required native install SCM exports
        shell: pwsh
        run: |
          python -c "from agent_control_plane.windows_scm_native_install_backend import probe_windows_scm_install_api; p=probe_windows_scm_install_api(); print(p); assert p.available"
