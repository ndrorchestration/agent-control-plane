name: reticulum-live-integration

on:
  pull_request:
    paths:
      - "src/agent_control_plane/reticulum_adapter.py"
      - "src/agent_control_plane/authority_sync.py"
      - "src/agent_control_plane/sync_transport.py"
      - "integration/reticulum/**"
      - ".github/workflows/reticulum-live-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-local-reticulum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "rns==1.5.4"
      - run: python integration/reticulum/live_authority_sync.py --timeout 20
