name: experimental-long-running-supervisor

on:
  pull_request:
    paths:
      - "src/agent_control_plane/supervisor_service_runner.py"
      - "src/agent_control_plane/supervisor_service.py"
      - "src/agent_control_plane/supervisor_signal.py"
      - "src/agent_control_plane/supervisor_ownership.py"
      - "src/agent_control_plane/supervisor_runtime_checkpoint.py"
      - "src/agent_control_plane/supervisor_recovery.py"
      - "src/agent_control_plane/supervisor_recovery_authorization.py"
      - "src/agent_control_plane/supervisor_concurrency.py"
      - "src/agent_control_plane/process_execution_admission.py"
      - "integration/supervisor/experimental_long_running_service.py"
      - "integration/supervisor/run_long_running_signal_integration.py"
      - ".github/workflows/experimental-long-running-supervisor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-signal-long-running:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python integration/supervisor/run_long_running_signal_integration.py
