name: reticulum-multihop-integration

on:
  pull_request:
    paths:
      - "src/agent_control_plane/reticulum_adapter.py"
      - "src/agent_control_plane/authority_sync.py"
      - "src/agent_control_plane/authority_state.py"
      - "integration/reticulum/reticulum_live_server.py"
      - "integration/reticulum/reticulum_transport_node.py"
      - "integration/reticulum/live_multihop_authority_sync.py"
      - ".github/workflows/reticulum-multihop-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-local-multihop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "rns==1.5.4"
      - run: python integration/reticulum/live_multihop_authority_sync.py --timeout 30
