[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Experimental control-plane kernel for bounded agent execution, policy checks, provenance, and fail-closed supervision"
requires-python = ">=3.10"

[project.optional-dependencies]
crypto = ["cryptography>=46,<52"]
context-measure = ["tiktoken==0.14.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "experiments/gsae_e0/tests"]
